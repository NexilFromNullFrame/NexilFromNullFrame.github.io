<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>NexilFromNullFrame Portfolio</title>
	
	<!-- OPTION B: BLOCKING INITIALIZATION INLINE INJECTION -->
	<script>
		if ('serviceWorker' in navigator) {
			// Register worker with explicit root subdirectory execution scopes
			navigator.serviceWorker.register('./coi-serviceworker.js', { scope: './' })
			.then(function (registration) {
				console.log('COI Service Worker active under scope: ', registration.scope);
				// If fully activated but browser security context isn't isolated yet
				if (registration.active && !window.crossOriginIsolated) {
					console.log('Security sandbox inactive. Forcing document reload sequence...');
					window.location.reload();
				}
			}).catch(function (error) {
				console.error('COI Registration alignment crash: ', error);
			});
		}
	</script>

	<!-- Standard Godot Engine Web Executable Styling Baseline -->
	<style>
		body {
			touch-action: none;
			margin: 0;
			border: 0;
			padding: 0;
			background-color: black;
			overflow: hidden;
		}

		#canvas {
			display: block;
			width: 100vw;
			height: 100vh;
		}

		#canvas:focus {
			outline: none;
		}

		#status {
			position: absolute;
			left: 0;
			top: 0;
			right: 0;
			bottom: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			visibility: visible;
		}

		#status-progress {
			width: 300px;
			height: 8px;
			background-color: #383838;
			border: 1px solid #222;
			padding: 1px;
			border-radius: 4px;
		}

		#status-progress-inner {
			height: 100%;
			width: 0;
			background-color: #2fa1ff;
			border-radius: 3px;
			transition: width 0.1s linear;
		}

		#status-indeterminate {
			visibility: hidden;
			width: 300px;
			height: 8px;
			background-color: #383838;
			border: 1px solid #222;
			border-radius: 4px;
			overflow: hidden;
			position: relative;
		}

		#status-indeterminate::after {
			content: '';
			display: block;
			width: 100px;
			height: 100%;
			background-color: #2fa1ff;
			position: absolute;
			animation: loading 1.5s infinite linear;
			border-radius: 3px;
		}

		@keyframes loading {
			0% { left: -100px; }
			100% { left: 300px; }
		}

		#status-notice {
			background-color: #3b3b3b;
			color: #ff5c5c;
			padding: 12px 24px;
			border-radius: 6px;
			font-family: sans-serif;
			font-size: 14px;
			box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
			display: none;
		}
	</style>
</head>
<body>
	<canvas id="canvas">
		Your browser does not support the canvas graphic layout element.
	</canvas>
	<div id="status">
		<div id="status-progress">
			<div id="status-progress-inner"></div>
		</div>
		<div id="status-indeterminate"></div>
		<div id="status-notice"></div>
	</div>

	<!-- Core Engine Script Execution Paths -->
	<script src="index.js"></script>
	<script>
		const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":634560,"index.wasm":45020100},"godotEngine":Engine};
		const engine = new Engine(GODOT_CONFIG);

		const statusProgress = document.getElementById('status-progress');
		const statusProgressInner = document.getElementById('status-progress-inner');
		const statusIndeterminate = document.getElementById('status-indeterminate');
		const statusNotice = document.getElementById('status-notice');

		function displayFailureNotice(text) {
			statusNotice.textContent = text;
			statusNotice.style.display = 'block';
			statusProgress.style.display = 'none';
			statusIndeterminate.style.display = 'none';
		}

		engine.startGame({
			'onProgress': function (current, total) {
				if (total > 0) {
					statusProgressInner.style.width = (current / total * 100) + '%';
					if (current === total) {
						statusProgress.style.display = 'none';
						statusIndeterminate.style.display = 'block';
					}
				} else {
					statusProgress.style.display = 'none';
					statusIndeterminate.style.display = 'block';
				}
			}
		}).then(() => {
			document.getElementById('status').style.display = 'none';
		}).catch((err) => {
			displayFailureNotice(err.message || err);
		});
	</script>
</body>
</html>
