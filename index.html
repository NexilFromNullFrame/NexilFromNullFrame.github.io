<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Nexil's Portfolio</title>

	<!-- MUST BE FIRST: External COI Service Worker for Multi-threading (SharedArrayBuffer) -->
	<script src="coi-serviceworker.js"></script>

	<!-- Favicons & Manifest -->
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
	<link rel="manifest" href="/site.webmanifest">
	
	<!-- Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@200;300;400&display=swap" rel="stylesheet">

	<style>
		:root {
			--win-blue: #0078d7;
			--win-red: #a40000;
			--win-bg: #1d1d1d;
		}

		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background-color: #0e1015;
			font-family: 'Source Sans 3', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			user-select: none;
			-webkit-user-select: none;
		}

		#canvas {
			display: block;
			width: 100%;
			height: 100%;
			border: 0;
		}

		#canvas:focus {
			outline: none;
		}

		#status-container {
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			background-color: #0e1015;
			z-index: 10;
		}

		#status-text {
			color: #ffffff;
			font-size: 1.1rem;
			font-weight: 500;
			margin-bottom: 12px;
			letter-spacing: 0.5px;
		}

		#progress-bar {
			width: 220px;
			height: 6px;
			background-color: #1e232d;
			border-radius: 3px;
			overflow: hidden;
		}

		#progress-fill {
			height: 100%;
			width: 0%;
			background-color: #ff4757;
			transition: width 0.15s ease-out;
		}
	</style>
</head>
<body>
	<canvas id="canvas">
		Your browser does not support the HTML5 canvas element.
	</canvas>

	<div id="status-container">
		<div id="status-text">Loading Portfolio...</div>
		<div id="progress-bar">
			<div id="progress-fill"></div>
		</div>
	</div>

	<!-- Main Godot Engine JS Loader -->
	<script src="index.js"></script>
	<script>
		const GODOT_CONFIG = {
			"args": [],
			"canvasResizePolicy": 2,
			"emscriptenPoolSize": 8,
			"ensureCrossOriginIsolationHeaders": true,
			"executable": "index",
			"experimentalVK": false,
			"fileSizes": {
				"index.pck": 602840,
				"index.wasm": 1601069
			},
			"focusCanvas": true,
			"gdextensionLibs": [],
			"godotPoolSize": 4
		};

		const engine = new Engine(GODOT_CONFIG);

		const statusContainer = document.getElementById('status-container');
		const statusText = document.getElementById('status-text');
		const progressFill = document.getElementById('progress-fill');

		engine.startGame({
			'onProgress': function (current, total) {
				if (total > 0) {
					const percentage = Math.floor((current / total) * 100);
					progressFill.style.width = percentage + '%';
					statusText.textContent = `Loading... ${percentage}%`;
				} else {
					statusText.textContent = 'Loading...';
				}
			},
		}).then(() => {
			statusContainer.style.display = 'none';
		}).catch((err) => {
			statusText.textContent = 'Error loading Portfolio';
			statusText.style.color = '#ff4757';
			console.error(err);
		});
	</script>
</body>
</html>
